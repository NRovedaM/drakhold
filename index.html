
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drakhold</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="game-container">

        <header id="game-header">
            <h1>Drakhold</h1>
            <span id="game-status">Preparando partida...</span>
        </header>

        <main id="game-map">
            <canvas id="game-canvas" width="1200" height="600">
                Seu navegador não suporta HTML5 Canvas.
            </canvas>
        </main>
    
    <footer id="game-controls">
        <p>Quantidade de unidades para enviar:</p>

        <div id="send-controls">
            <button data-percentage="25">25%</button>
            <button data-percentage="50" class="active">50%</button>
            <button data-percentage="75">75%</button>
            <button data-percentage="100">100%</button>
        </div>
    </footer>

    </div>

    <script type="module" src="js/canvasTest.js"></script>
</body>
</html>
